openapi: 3.0.3
info:
  title: Northstar CRM API
  version: 1.0.0
  description: Versioned JSON API for CRM objects. Authenticate with Sanctum personal access tokens.
servers:
  - url: /api/v1
paths:
  /leads:
    get:
      summary: List leads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200': { description: Paginated leads }
    post:
      summary: Create lead
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /leads/{id}:
    get:
      summary: Show lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lead }
    put:
      summary: Update lead
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete lead
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
  /accounts:
    get:
      summary: List accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated accounts }
  /contacts:
    get:
      summary: List contacts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated contacts }
  /opportunities:
    get:
      summary: List opportunities
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated opportunities }
  /cases:
    get:
      summary: List cases
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated cases }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Lead:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        email: { type: string }
        lead_status: { type: string }
        owner_id: { type: integer }
