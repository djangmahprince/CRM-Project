openapi: 3.0.3
info:
  title: Northstar CRM API
  version: 1.0.0
  description: Versioned JSON API for CRM integrations (SRS §8.3). Authenticate with Sanctum personal access tokens.
servers:
  - url: /api
paths:
  /tokens:
    post:
      summary: Issue a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Token issued
  /v1/leads:
    get:
      summary: List visible leads
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated leads
    post:
      summary: Create a lead
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Lead created
  /v1/leads/{id}:
    get:
      summary: Show a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Lead
    patch:
      summary: Update a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Lead updated
    delete:
      summary: Soft-delete a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
  /v1/accounts:
    get:
      summary: List visible accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated accounts
    post:
      summary: Create an account
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Account created
  /v1/accounts/{id}:
    get:
      summary: Show an account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Account
    patch:
      summary: Update an account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Account updated
    delete:
      summary: Soft-delete an account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
  /v1/contacts:
    get:
      summary: List visible contacts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated contacts
    post:
      summary: Create a contact
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Contact created
  /v1/contacts/{id}:
    get:
      summary: Show a contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Contact
    patch:
      summary: Update a contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Contact updated
    delete:
      summary: Soft-delete a contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
  /v1/opportunities:
    get:
      summary: List visible opportunities
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated opportunities
    post:
      summary: Create an opportunity
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Opportunity created
  /v1/opportunities/{id}:
    get:
      summary: Show an opportunity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Opportunity
    patch:
      summary: Update an opportunity
      security: [{ bearerAuth: [] }]
      parameters:
