openapi: 3.0.3
info:
  title: Northstar CRM API
  version: 1.0.0
  description: Versioned JSON API for CRM integrations (SRS §8.3). Authenticate with Sanctum personal access tokens.
servers:
  - url: /api
paths:
  /tokens:
    post:
      summary: Issue a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Token issued
  /v1/leads:
    get:
      summary: List visible leads
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated leads
    post:
      summary: Create a lead
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Lead created
  /v1/leads/{id}:
    get:
      summary: Show a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Lead
    patch:
      summary: Update a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Lead updated
    delete:
      summary: Soft-delete a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
