          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Opportunity updated
    delete:
      summary: Soft-delete an opportunity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
  /v1/cases:
    get:
      summary: List visible cases
      security: [{ bearerAuth: [] }]
      responses:
