          description: Paginated cases
    post:
      summary: Create a case
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Case created
  /v1/cases/{id}:
    get:
      summary: Show a case
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Case
    patch:
      summary: Update a case
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Case updated
    delete:
      summary: Soft-delete a case
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
